[package]
name = "solana-meme-coin"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_meme_coin"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = { version = "0.29.0", features = ["token_2022", "token_2022_extensions"] }
solana-program = "1.17.0"
spl-token-2022 = { version = "2.0.0", features = ["no-entrypoint"] }
spl-tlv-account-resolution = "0.5.0"
spl-transfer-hook-interface = "0.5.0"
