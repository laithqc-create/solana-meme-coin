[package]
name = "solana-meme-coin"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_meme_coin"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", features = ["token_2022"] }
spl-tlv-account-resolution = "0.9.0"
spl-transfer-hook-interface = "0.9.0"
# Raydium's own CPI adapter for their CPMM program - deliberately pinned to
# exactly anchor-lang/anchor-spl 0.32.1 (see raydium-io/raydium-cpi's own
# README: they intentionally lag Anchor's newest releases for AMM contract
# stability). Verified directly from source (cloned the repo rather than
# trusting a blog) that the real package name IS raydium-cpmm-cpi with
# [lib] name = "raydium_cpmm_cpi" - not raydium_cp_swap, which several
# older/community examples online still use for a now-superseded crate.
raydium-cpmm-cpi = { git = "https://github.com/raydium-io/raydium-cpi", package = "raydium-cpmm-cpi" }

# The following pins work around a known, currently-open gap in Solana's
# official BPF build toolchain: cargo-build-sbf bundles its own pinned
# Rust/Cargo (currently 1.84.x) separate from the system toolchain, and
# that bundled Cargo does not yet support the `edition2024` feature
# (stabilized in Rust 1.85). Several transitive dependencies pulled in by
# anchor-spl's token_2022 feature (via spl-token-2022 8.x) have moved to
# edition2024 in their newest releases. This is a confirmed, officially
# acknowledged upstream issue (see anza-xyz/solana-sdk#385, resolved via
# exactly this pinning approach by an Anza maintainer) - NOT a workaround
# invented for this project. Pinned to the newest release of each crate
# that predates its edition2024 migration:
blake3 = "=1.5.5"
indexmap = "=2.2.6"
zeroize_derive = "=1.4.3"
unicode-segmentation = "=1.12.0"
