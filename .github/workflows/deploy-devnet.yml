name: Deploy to Devnet

# Manual-only trigger. Deploys the program to Solana Devnet using:
#   - The REAL program keypair, reconstructed from the DEVNET_PROGRAM_KEYPAIR
#     repo secret (never printed, never committed - exists only in the
#     runner's ephemeral filesystem for the duration of this job).
#   - A PERSISTENT payer/fee wallet, reconstructed from the
#     DEVNET_PAYER_KEYPAIR repo secret. This wallet is devnet-only, holds
#     zero real value, and is pre-funded via the web faucet (which uses a
#     captcha, not IP-based rate limiting) specifically so this workflow
#     never has to fight GitHub-hosted runners' shared IPs getting
#     rate-limited by the devnet CLI airdrop endpoint.
#
# SECURITY NOTE:
# Both DEVNET_PROGRAM_KEYPAIR and DEVNET_PAYER_KEYPAIR must be set directly
# in GitHub's UI (Settings -> Secrets and variables -> Actions), never
# pasted in chat or committed to the repo. DEVNET_PROGRAM_KEYPAIR is the
# program's real upgrade authority - even on devnet, treat the habit of
# handling it correctly as practice for the mainnet version of this same
# workflow later. DEVNET_PAYER_KEYPAIR holds only worthless devnet SOL.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a devnet deploy'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-devnet:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental runs
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation input did not match 'deploy'. Aborting."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI (pinned, matches this repo's anchor-lang)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1

      - name: Reconstruct real program keypair from secret
        env:
          DEVNET_PROGRAM_KEYPAIR: ${{ secrets.DEVNET_PROGRAM_KEYPAIR }}
        run: |
          if [ -z "$DEVNET_PROGRAM_KEYPAIR" ]; then
            echo "DEVNET_PROGRAM_KEYPAIR secret is not set. Set it in repo Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
          mkdir -p target/deploy
          printf '%s' "$DEVNET_PROGRAM_KEYPAIR" > target/deploy/solana_meme_coin-keypair.json
          chmod 600 target/deploy/solana_meme_coin-keypair.json
          # Sanity check: confirm the pubkey matches what's already synced
          # in lib.rs/Anchor.toml, WITHOUT ever printing the private key.
          ACTUAL=$(solana-keygen pubkey target/deploy/solana_meme_coin-keypair.json)
          EXPECTED="EkF67nLhbAzj45Sv3ggYRLq5NLUXrp1bLei2h4APGJ3N"
          echo "Program pubkey from secret: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "MISMATCH: secret's pubkey ($ACTUAL) does not match the program ID already synced in this repo ($EXPECTED)."
            echo "Refusing to deploy - this would deploy under the wrong program ID, or the secret contains the wrong keypair."
            exit 1
          fi

      - name: Reconstruct persistent, pre-funded payer wallet from secret
        env:
          DEVNET_PAYER_KEYPAIR: ${{ secrets.DEVNET_PAYER_KEYPAIR }}
        run: |
          if [ -z "$DEVNET_PAYER_KEYPAIR" ]; then
            echo "DEVNET_PAYER_KEYPAIR secret is not set. Set it in repo Settings > Secrets and variables > Actions - fund it via https://faucet.solana.com first (select Devnet)."
            exit 1
          fi
          mkdir -p "$HOME/.config/solana"
          printf '%s' "$DEVNET_PAYER_KEYPAIR" > "$HOME/.config/solana/id.json"
          chmod 600 "$HOME/.config/solana/id.json"
          solana config set --url devnet --keypair "$HOME/.config/solana/id.json"
          PAYER=$(solana address)
          BALANCE=$(solana balance --lamports | awk '{print $1}')
          echo "Payer wallet: $PAYER"
          echo "Current balance: $BALANCE lamports"
          MIN_LAMPORTS=1000000000
          if [ "$BALANCE" -lt "$MIN_LAMPORTS" ]; then
            echo "Balance too low for a safe deploy (need at least ~1 SOL as a margin). Fund $PAYER further at https://faucet.solana.com (select Devnet) and re-run."
            exit 1
          fi

      - name: Build program
        run: |
          anchor build

      - name: Deploy to devnet
        run: |
          anchor deploy --provider.cluster devnet --provider.wallet "$HOME/.config/solana/id.json"

      - name: Verify on-chain deployment
        run: |
          solana program show EkF67nLhbAzj45Sv3ggYRLq5NLUXrp1bLei2h4APGJ3N --url devnet

      - name: Summary
        run: |
          echo "Deployed program EkF67nLhbAzj45Sv3ggYRLq5NLUXrp1bLei2h4APGJ3N to devnet."
          echo "Explorer: https://explorer.solana.com/address/EkF67nLhbAzj45Sv3ggYRLq5NLUXrp1bLei2h4APGJ3N?cluster=devnet"
