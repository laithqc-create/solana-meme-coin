name: Generate Program Keypair

# Manual-only trigger. This workflow generates a NEW Solana program keypair
# on the runner, replaces the placeholder program ID everywhere in the repo
# (declare_id! + Anchor.toml), commits ONLY the public ID change, and
# uploads the private keypair as a short-retention, authenticated-download
# artifact. The private key is never printed to logs, never committed to
# git, and never leaves this run except via the artifact download (which
# requires repo read access to fetch).
#
# SECURITY NOTE FOR WHOEVER RUNS THIS:
# The downloaded target/deploy/*-keypair.json IS the program's upgrade
# authority (until/unless authority is later transferred or renounced).
# Treat it like a mainnet secret from the moment it's generated:
#   - Download it immediately after the run completes.
# - Store it in a secrets manager / hardware-backed store, not a laptop
#     Downloads folder.
#   - Delete the workflow run's artifact from GitHub once you've saved it
#     elsewhere (Actions artifacts are downloadable by anyone with repo
#     read access for the retention window).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "generate" to confirm you want a NEW program keypair created'
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate-keypair:
    if: ${{ github.event.inputs.confirm == 'generate' }}
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental re-runs
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "generate" ]; then
            echo "Confirmation input did not match 'generate'. Aborting."
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1

      - name: Generate new program keypair
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent \
            -o target/deploy/solana_meme_coin-keypair.json
          # Only the PUBLIC key is ever echoed to logs.
          PUBKEY=$(solana-keygen pubkey target/deploy/solana_meme_coin-keypair.json)
          echo "Generated program pubkey: $PUBKEY"
          echo "PROGRAM_PUBKEY=$PUBKEY" >> "$GITHUB_ENV"

      - name: Sync program ID into declare_id! and Anchor.toml
        run: |
          anchor keys sync

      - name: Show resulting diff (public ID only, no key material)
        run: |
          git diff --stat
          git diff -- '**/lib.rs' Anchor.toml

      - name: Commit public program ID change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '**/lib.rs' Anchor.toml
          git commit -m "Sync real program ID (${{ env.PROGRAM_PUBKEY }}) via anchor keys sync

          Generated by manually-triggered generate-program-keypair workflow,
          run ${{ github.run_id }}. Private keypair distributed via this
          run's artifact only, never committed."
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload keypair as short-retention artifact
        uses: actions/upload-artifact@v4
        with:
          name: program-keypair-${{ github.run_id }}
          path: target/deploy/solana_meme_coin-keypair.json
          retention-days: 1
          if-no-files-found: error

      - name: Final reminder
        run: |
          echo "Public program ID committed to ${{ github.ref_name }}: ${{ env.PROGRAM_PUBKEY }}"
          echo "Download the 'program-keypair-${{ github.run_id }}' artifact NOW from this run's summary page."
          echo "It auto-expires in 1 day. Store it securely, then delete the artifact from GitHub once saved."
