name: Rust Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  cargo-check:
    name: cargo check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-meme-coin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana-meme-coin/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('solana-meme-coin/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check
        run: cargo check --verbose

      - name: cargo test (unit tests only, no BPF target)
        run: cargo test --lib --verbose

  anchor-build:
    name: anchor build
    runs-on: ubuntu-latest
    needs: cargo-check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI (via AVM)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install latest
          avm use latest
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Generate throwaway local wallet (CI only, never used for real funds)
        run: solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json

      - name: anchor build
        run: anchor build

      - name: Upload build artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build-output
          path: target/deploy/
          if-no-files-found: warn
